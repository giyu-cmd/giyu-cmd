<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#12233f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="200" rx="14" fill="url(#sky)" stroke="#30363d" stroke-width="2"/>

  <!-- moon -->
  <circle cx="700" cy="45" r="20" fill="#e6edf3" opacity="0.9"/>
  <circle cx="708" cy="40" r="18" fill="#12233f"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="55" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="25" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="60" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="70" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting clouds -->
  <g fill="#1f2a44">
    <g>
      <animateTransform attributeName="transform" type="translate" from="850 0" to="-150 0" dur="16s" begin="-4s" repeatCount="indefinite"/>
      <rect x="0" y="70" width="70" height="10" rx="5"/>
      <rect x="15" y="62" width="40" height="10" rx="5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="850 0" to="-150 0" dur="22s" begin="-14s" repeatCount="indefinite"/>
      <rect x="0" y="40" width="90" height="10" rx="5"/>
      <rect x="20" y="32" width="50" height="10" rx="5"/>
    </g>
  </g>

  <!-- ground -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#30363d" stroke-width="2"/>
  <line x1="0" y1="162" x2="800" y2="162" stroke="#30363d" stroke-width="2" stroke-dasharray="14 30">
    <animate attributeName="stroke-dashoffset" from="44" to="0" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="176" x2="800" y2="176" stroke="#21262d" stroke-width="2" stroke-dasharray="6 50">
    <animate attributeName="stroke-dashoffset" from="56" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- cactus A -->
  <g fill="#3fb950">
    <animateTransform attributeName="transform" type="translate" from="820 0" to="-60 0" dur="4s" repeatCount="indefinite"/>
    <rect x="0" y="110" width="10" height="40" rx="3"/>
    <rect x="-8" y="122" width="8" height="6"/>
    <rect x="-8" y="116" width="6" height="12" rx="2"/>
    <rect x="10" y="118" width="8" height="6"/>
    <rect x="12" y="112" width="6" height="12" rx="2"/>
  </g>

  <!-- cactus B -->
  <g fill="#3fb950">
    <animateTransform attributeName="transform" type="translate" from="820 0" to="-60 0" dur="4s" begin="-2s" repeatCount="indefinite"/>
    <rect x="0" y="118" width="10" height="32" rx="3"/>
    <rect x="12" y="126" width="10" height="24" rx="3"/>
    <rect x="-8" y="126" width="8" height="6"/>
    <rect x="-8" y="121" width="6" height="11" rx="2"/>
  </g>

  <!-- player -->
  <g transform="translate(80 0)">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
        keyTimes="0;0.225;0.2875;0.3875;0.45;0.725;0.7875;0.8875;0.95;1"
        values="0 0;0 0;0 -55;0 -55;0 0;0 0;0 -55;0 -55;0 0;0 0"/>
      <!-- body -->
      <rect x="0" y="110" width="28" height="30" rx="4" fill="#58a6ff"/>
      <rect x="4" y="90" width="24" height="20" rx="4" fill="#79b8ff"/>
      <rect x="20" y="97" width="5" height="5" fill="#0d1117"/>
      <rect x="12" y="82" width="2" height="8" fill="#79b8ff"/>
      <circle cx="13" cy="80" r="3" fill="#f778ba">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <!-- legs -->
      <g fill="#1f6feb">
        <g>
          <animate attributeName="opacity" values="1;0" dur="0.3s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="4" y="140" width="8" height="10"/>
          <rect x="18" y="140" width="8" height="5"/>
        </g>
        <g>
          <animate attributeName="opacity" values="0;1" dur="0.3s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="4" y="140" width="8" height="5"/>
          <rect x="18" y="140" width="8" height="10"/>
        </g>
      </g>
    </g>
  </g>

  <!-- HUD -->
  <text x="20" y="28" fill="#8b949e" font-size="13">$ git run --survive</text>
  <text x="780" y="28" fill="#58a6ff" font-size="13" text-anchor="end">HI 99999</text>
</svg>
